server {
    listen 80;
    server_name coreable-saf.com www.coreable-saf.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name coreable-saf.com www.coreable-saf.com;

    ssl_certificate /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:3000;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location /actuator/ {
        proxy_pass $api_upstream;
    }

    location /uploads/products/ {
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
