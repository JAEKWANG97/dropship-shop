name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/jaekwang97/dropship-shop-api
  WEB_IMAGE: ghcr.io/jaekwang97/dropship-shop-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test API
        working-directory: apps/api
        run: ./gradlew test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Check whitespace
        run: git diff --check

  build-and-push:
    runs-on: ubuntu-24.04-arm
    needs: verify
    outputs:
      api-image: ${{ steps.meta.outputs.api-image }}
      web-image: ${{ steps.meta.outputs.web-image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build API jar
        working-directory: apps/api
        run: ./gradlew bootJar
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Resolve image tags
        run: |
          echo "api-image=${API_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web-image=${WEB_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,scope=api-arm64,mode=max
          tags: |
            ${{ steps.meta.outputs.api-image }}
            ${{ env.API_IMAGE }}:latest
      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=web-arm64
          cache-to: type=gha,scope=web-arm64,mode=max
          tags: |
            ${{ steps.meta.outputs.web-image }}
            ${{ env.WEB_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          aws-region: ap-northeast-2
          role-to-assume: arn:aws:iam::445567114845:role/coreable-github-deploy
      - name: Deploy on EC2 through SSM
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api-image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web-image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commands=$(jq -n \
            --arg api_image "${API_IMAGE}" \
            --arg web_image "${WEB_IMAGE}" \
            --arg ghcr_username "${GHCR_USERNAME}" \
            --arg ghcr_token "${GHCR_TOKEN}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            '{commands: [
              "set -eu",
              "sudo mkdir -p /opt/coreable",
              ("sudo curl -fsSL " + ("https://raw.githubusercontent.com/" + $repository + "/" + $sha + "/infra/aws/ec2/compose.prod.yml" | @sh) + " -o /opt/coreable/compose.prod.yml"),
              ("sudo curl -fsSL " + ("https://raw.githubusercontent.com/" + $repository + "/" + $sha + "/infra/aws/ec2/nginx.conf" | @sh) + " -o /opt/coreable/nginx.conf"),
              "sudo test -f /var/lib/coreable/proxy/certs/cloudflare-origin.pem",
              "sudo test -f /var/lib/coreable/proxy/certs/cloudflare-origin.key",
              "sudo test -f /opt/coreable/.env",
              "for required_key in APP_BANK_TRANSFER_BANK_NAME APP_BANK_TRANSFER_ACCOUNT_NUMBER APP_BANK_TRANSFER_ACCOUNT_HOLDER; do sudo grep -Eq \"^${required_key}=.+\" /opt/coreable/.env || exit 1; done",
              ("printf %s " + ($ghcr_token | @sh) + " | sudo docker login ghcr.io -u " + ($ghcr_username | @sh) + " --password-stdin"),
              ("sudo sed -i " + ("s|^API_IMAGE=.*|API_IMAGE=" + $api_image + "|" | @sh) + " /opt/coreable/.env"),
              ("sudo sed -i " + ("s|^WEB_IMAGE=.*|WEB_IMAGE=" + $web_image + "|" | @sh) + " /opt/coreable/.env"),
              "cd /opt/coreable",
              "sudo docker compose --env-file .env -f compose.prod.yml pull",
              "sudo docker logout ghcr.io >/dev/null 2>&1 || true",
              "sudo docker compose --env-file .env -f compose.prod.yml up -d",
              "sudo docker compose --env-file .env -f compose.prod.yml ps",
              "healthy=0; for i in $(seq 1 40); do if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null; then healthy=1; break; fi; sleep 3; done; if [ \"${healthy}\" != 1 ]; then sudo docker compose --env-file .env -f compose.prod.yml logs --tail=200 api; exit 1; fi",
              "sudo docker image prune -af --filter until=168h"
            ]}')
          command_id=$(aws ssm send-command \
            --instance-ids i-0c795cb4b0f0b4177 \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters "${commands}" \
            --query Command.CommandId \
            --output text)
          for _ in $(seq 1 90); do
            command_status=$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id i-0c795cb4b0f0b4177 \
              --query Status \
              --output text 2>/dev/null || true)
            case "${command_status}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 2
          done
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id i-0c795cb4b0f0b4177 \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          test "${command_status}" = Success
