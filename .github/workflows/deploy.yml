name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/jaekwang97/dropship-shop-api
  WEB_IMAGE: ghcr.io/jaekwang97/dropship-shop-web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test API
        working-directory: apps/api
        run: ./gradlew test
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint web
        working-directory: apps/web
        run: npm run lint
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Check whitespace
        run: git diff --check

  build-and-push:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      api-image: ${{ steps.meta.outputs.api-image }}
      web-image: ${{ steps.meta.outputs.web-image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build API jar
        working-directory: apps/api
        run: ./gradlew bootJar
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Resolve image tags
        run: |
          echo "api-image=${API_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web-image=${WEB_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.api-image }}
            ${{ env.API_IMAGE }}:latest
      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.web-image }}
            ${{ env.WEB_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "infra/aws/ec2/compose.prod.yml,infra/aws/ec2/Caddyfile"
          target: "/tmp/coreable-deploy"
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api-image }}
          WEB_IMAGE: ${{ needs.build-and-push.outputs.web-image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: API_IMAGE,WEB_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/coreable
            sudo cp /tmp/coreable-deploy/infra/aws/ec2/compose.prod.yml /opt/coreable/compose.prod.yml
            sudo cp /tmp/coreable-deploy/infra/aws/ec2/Caddyfile /opt/coreable/Caddyfile
            sudo test -f /opt/coreable/.env
            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            sudo sed -i "s|^API_IMAGE=.*|API_IMAGE=${API_IMAGE}|" /opt/coreable/.env
            sudo sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" /opt/coreable/.env
            cd /opt/coreable
            sudo docker compose --env-file .env -f compose.prod.yml pull
            sudo docker compose --env-file .env -f compose.prod.yml up -d
            sudo docker compose --env-file .env -f compose.prod.yml ps
            for i in $(seq 1 40); do
              if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null; then
                exit 0
              fi
              sleep 3
            done
            sudo docker compose --env-file .env -f compose.prod.yml logs --tail=200 api
            exit 1
