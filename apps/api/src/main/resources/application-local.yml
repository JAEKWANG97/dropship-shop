spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dropship_shop}
    username: ${DB_USERNAME:dropship}
    password: ${DB_PASSWORD:dropship}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

payments:
  toss:
    secret-key: ${PAYMENTS_TOSS_SECRET_KEY:}
    base-url: ${PAYMENTS_TOSS_BASE_URL:https://api.tosspayments.com}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:local-dev-jwt-secret-change-before-production}
    cookie-secure: false
    success-redirect-uri: ${APP_AUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback/success}
  oauth:
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}
    kakao:
      client-id: ${OAUTH_KAKAO_CLIENT_ID:}
      client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/kakao/callback}
    naver:
      client-id: ${OAUTH_NAVER_CLIENT_ID:}
      client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_NAVER_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/naver/callback}
