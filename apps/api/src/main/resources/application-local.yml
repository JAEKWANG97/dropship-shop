spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dropship_shop}
    username: ${DB_USERNAME:dropship}
    password: ${DB_PASSWORD:dropship}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

sms:
  sens:
    enabled: ${SMS_SENS_ENABLED:false}
    access-key: ${SMS_SENS_ACCESS_KEY:}
    secret-key: ${SMS_SENS_SECRET_KEY:}
    service-id: ${SMS_SENS_SERVICE_ID:}
    from-number: ${SMS_SENS_FROM_NUMBER:}

app:
  sales:
    enabled: ${APP_SALES_ENABLED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  inquiry:
    lookup-secret: ${APP_INQUIRY_LOOKUP_SECRET:local-inquiry-lookup-secret-change-me-123456}
  email:
    from-address: ${EMAIL_FROM_ADDRESS:contact@coreable-saf.com}
    ses:
      enabled: ${EMAIL_SES_ENABLED:false}
      region: ${EMAIL_SES_REGION:ap-northeast-2}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  dev-login:
    enabled: true
  storage:
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:/uploads/products}
    local:
      upload-dir: ${APP_STORAGE_LOCAL_UPLOAD_DIR:${APP_CATALOG_IMAGE_STORAGE_PATH:build/product-images}}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:local-dev-jwt-secret-change-before-production}
    cookie-secure: false
    success-redirect-uri: ${APP_AUTH_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback/success}
  oauth:
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}
    kakao:
      client-id: ${OAUTH_KAKAO_CLIENT_ID:}
      client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/kakao/callback}
    naver:
      client-id: ${OAUTH_NAVER_CLIENT_ID:}
      client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_NAVER_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/naver/callback}
