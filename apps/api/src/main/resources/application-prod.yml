spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

payments:
  toss:
    secret-key: ${PAYMENTS_TOSS_SECRET_KEY}
    base-url: ${PAYMENTS_TOSS_BASE_URL:https://api.tosspayments.com}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
