spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

sms:
  sens:
    enabled: ${SMS_SENS_ENABLED:false}
    access-key: ${SMS_SENS_ACCESS_KEY}
    secret-key: ${SMS_SENS_SECRET_KEY}
    service-id: ${SMS_SENS_SERVICE_ID}
    from-number: ${SMS_SENS_FROM_NUMBER}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL}
  sales:
    enabled: ${APP_SALES_ENABLED:false}
  bank-transfer:
    bank-name: ${APP_BANK_TRANSFER_BANK_NAME}
    account-number: ${APP_BANK_TRANSFER_ACCOUNT_NUMBER}
    account-holder: ${APP_BANK_TRANSFER_ACCOUNT_HOLDER}
  domeggook:
    enabled: ${DOMEGGOOK_PURCHASE_ENABLED:false}
    auto-order-enabled: ${DOMEGGOOK_AUTO_ORDER_ENABLED:false}
    api-key: ${DOMEGGOOK_OPEN_API_KEY:}
    user-id: ${DOMEGGOOK_PURCHASE_USER_ID:}
    password: ${DOMEGGOOK_PURCHASE_USER_PASSWORD:}
    client-ip: ${DOMEGGOOK_PURCHASE_CLIENT_IP:}
  inquiry:
    lookup-secret: ${APP_INQUIRY_LOOKUP_SECRET}
  email:
    from-address: ${EMAIL_FROM_ADDRESS:contact@coreable-saf.com}
    ses:
      enabled: ${EMAIL_SES_ENABLED:false}
      region: ${EMAIL_SES_REGION:ap-northeast-2}
  storage:
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:/uploads/products}
    local:
      upload-dir: ${APP_STORAGE_LOCAL_UPLOAD_DIR:/var/app/uploads/products}
  internal:
    sync-token: ${APP_INTERNAL_SYNC_TOKEN}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET}
    cookie-secure: true
    success-redirect-uri: ${APP_AUTH_SUCCESS_REDIRECT_URI}
  oauth:
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
      redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI}
    kakao:
      client-id: ${OAUTH_KAKAO_CLIENT_ID}
      client-secret: ${OAUTH_KAKAO_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_KAKAO_REDIRECT_URI}
    naver:
      client-id: ${OAUTH_NAVER_CLIENT_ID}
      client-secret: ${OAUTH_NAVER_CLIENT_SECRET}
      redirect-uri: ${OAUTH_NAVER_REDIRECT_URI}

logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
