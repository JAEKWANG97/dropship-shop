spring:
  application:
    name: dropship-shop-api
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
  sales:
    enabled: ${APP_SALES_ENABLED:false}
    closed-notice: ${APP_SALES_CLOSED_NOTICE:구매안전서비스 준비 후 판매를 시작합니다. 현재 주문은 받지 않습니다.}
  inquiry:
    lookup-secret: ${APP_INQUIRY_LOOKUP_SECRET:local-inquiry-lookup-secret-change-me-123456}
    consent-policy-version: support-inquiry-privacy-2026-07-13
  email:
    from-address: ${EMAIL_FROM_ADDRESS:contact@coreable-saf.com}
    ses:
      enabled: ${EMAIL_SES_ENABLED:false}
      region: ${EMAIL_SES_REGION:ap-northeast-2}
  auth:
    jwt-issuer: dropship-shop-api
    access-token-cookie-name: ACCESS_TOKEN
    access-token-ttl-seconds: 7200
    oauth-state-cookie-name: OAUTH2_STATE
    oauth-state-ttl-seconds: 300
  policies:
    required-terms-version: prelaunch-2026-06-30
    required-privacy-version: prelaunch-2026-06-30
    required-order-policy-version: prelaunch-2026-06-30
    required-cancellation-refund-policy-version: prelaunch-2026-06-30
    required-out-of-stock-notice-version: prelaunch-2026-06-30
    checkout-confirmed-notice-text: "주문 상품, 입금 금액, 배송지, 배송/취소/환불 정책, 결제 후 품절 가능성과 품절 시 해당 배송 그룹 주문 금액 환불 안내를 확인했습니다."
  bank-transfer:
    bank-name: ${APP_BANK_TRANSFER_BANK_NAME:입금 계좌 준비중}
    account-number: ${APP_BANK_TRANSFER_ACCOUNT_NUMBER:입금 계좌 준비중}
    account-holder: ${APP_BANK_TRANSFER_ACCOUNT_HOLDER:가라사니}
    deposit-deadline-hours: ${APP_BANK_TRANSFER_DEPOSIT_DEADLINE_HOURS:24}
    cash-receipt-notice: ${APP_BANK_TRANSFER_CASH_RECEIPT_NOTICE:현금영수증은 요청 시 홈택스에서 발급하며, 의무발행 대상 거래는 요청 여부와 관계없이 발급합니다.}
  domeggook:
    enabled: ${DOMEGGOOK_PURCHASE_ENABLED:false}
    auto-order-enabled: ${DOMEGGOOK_AUTO_ORDER_ENABLED:false}
    api-key: ${DOMEGGOOK_OPEN_API_KEY:}
    user-id: ${DOMEGGOOK_PURCHASE_USER_ID:}
    password: ${DOMEGGOOK_PURCHASE_USER_PASSWORD:}
    client-ip: ${DOMEGGOOK_PURCHASE_CLIENT_IP:}
